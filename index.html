<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Ahorcado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        <h1>Hangman</h1>
        
        <canvas id="hangmanCanvas" width="200" height="230"></canvas>
        
        <div id="word-display">Loading config...</div>
        
        <div id="message"></div>
        
        <div id="keyboard"></div>
        
        <button id="reset-btn" onclick="initGame()">Play again</button>
    </div>

    <script>
// Variables globales que se llenarán con los archivos JSON
        let words = []; 
        let maxMistakes = 6; 
        
        let selectedWord = ""; // Aquí se guardará la frase completa
        let guessedLetters = [];
        let mistakes = 0;

        const wordDisplay = document.getElementById("word-display");
        const keyboard = document.getElementById("keyboard");
        const message = document.getElementById("message");
        const canvas = document.getElementById("hangmanCanvas");
        const ctx = canvas.getContext("2d");

        // Todos los trazos posibles para dibujar el monito por completo
        const allDrawStages = [
            // 0. La Horca
            () => {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#ffffff"; 
                ctx.beginPath();
                ctx.moveTo(10, 220); ctx.lineTo(150, 220);
                ctx.moveTo(40, 220); ctx.lineTo(40, 20);
                ctx.lineTo(120, 20);
                ctx.lineTo(120, 50);
                ctx.stroke();
            },
            // 1. Cabeza
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.arc(120, 70, 20, 0, Math.PI * 2); ctx.stroke(); },
            // 2. Cuerpo
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(120, 90); ctx.lineTo(120, 150); ctx.stroke(); },
            // 3. Brazo izquierdo
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(120, 110); ctx.lineTo(90, 130); ctx.stroke(); },
            // 4. Brazo derecho
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(120, 110); ctx.lineTo(150, 130); ctx.stroke(); },
            // 5. Pierna izquierda
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(120, 150); ctx.lineTo(90, 190); ctx.stroke(); },
            // 6. Pierna derecha
            () => { ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(120, 150); ctx.lineTo(150, 190); ctx.stroke(); }
        ];

        async function loadGameResources() {
            try {
                const [wordsResponse, configResponse] = await Promise.all([
                    fetch('words.json'),
                    fetch('config.json')
                ]);

                if (!wordsResponse.ok || !configResponse.ok) {
                    throw new Error("Error al buscar los archivos JSON.");
                }

                words = await wordsResponse.json();
                const config = await configResponse.json();
                
                maxMistakes = parseInt(config.maxMistakes) || 6;

                initGame();
            } catch (error) {
                console.error("Error inicializando la app:", error);
                wordDisplay.textContent = "Error de configuración";
                message.textContent = "Asegúrate de que 'words.json' y 'config.json' existan.";
                message.className = "lose";
            }
        }

        function initGame() {
            if (words.length === 0) return;

            selectedWord = words[Math.floor(Math.random() * words.length)].toUpperCase();
            guessedLetters = [];
            mistakes = 0;
            
            message.textContent = "";
            message.className = "";
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allDrawStages[0](); 
            
            createKeyboard();
            updateWordDisplay();
        }

        function createKeyboard() {
            keyboard.innerHTML = "";
            const alphabet = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
            
            alphabet.split("").forEach(letter => {
                const button = document.createElement("button");
                button.textContent = letter;
                button.classList.add("btn-letter");
                button.onclick = () => handleGuess(letter, button);
                keyboard.appendChild(button);
            });
        }

        function updateWordDisplay() {
            // CAMBIO AQUÍ: Si el carácter es un espacio en blanco, lo deja pasar tal cual. 
            // Si es una letra, revisa si ya fue adivinada; si no, pone un guion bajo.
            const displayArray = selectedWord.split("").map(letter => {
                if (letter === " ") {
                    return " "; // Usamos un espacio duro (&nbsp;) para que HTML lo renderice bien en pantalla
                }
                return guessedLetters.includes(letter) ? letter : "_";
            });
            
            wordDisplay.textContent = displayArray.join(" ");
            
            // CAMBIO AQUÍ: Para ganar, comprobamos si todas las LETRAS (ignorando los espacios) han sido descubiertas
            const isWon = selectedWord.split("").every(letter => {
                return letter === " " || guessedLetters.includes(letter);
            });
            
            if (isWon) {
                message.textContent = "You won! 🎉";
                message.className = "win";
                disableAllButtons();
            }
        }

        function handleGuess(letter, button) {
            button.disabled = true;
            
            if (selectedWord.includes(letter)) {
                guessedLetters.push(letter);
                updateWordDisplay();
            } else {
                mistakes++;
                
                const totalBodyParts = allDrawStages.length - 1; 
                const stageIndex = Math.ceil((mistakes / maxMistakes) * totalBodyParts);
                
                for (let i = 1; i <= stageIndex; i++) {
                    if (allDrawStages[i]) allDrawStages[i]();
                }
                
                if (mistakes >= maxMistakes) {
                    message.textContent = `You lost! Answer: ${selectedWord}`;
                    message.className = "lose";
                    
                    allDrawStages.forEach(draw => draw());
                    disableAllButtons();
                }
            }
        }

        function disableAllButtons() {
            const buttons = document.querySelectorAll(".btn-letter");
            buttons.forEach(btn => btn.disabled = true);
        }

        loadGameResources();
    </script>
</body>
</html>
